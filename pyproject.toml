[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-predictor"
version = "2.0.0"
description = "Automated football match outcome & score predictions across 21 European leagues and UEFA competitions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martim Barros" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "requests>=2.31",
    "joblib>=1.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
notebooks = ["jupyter", "nbconvert", "ipykernel", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
football-predictor = "football_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY"]
ignore = ["PD011", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "B018"]
